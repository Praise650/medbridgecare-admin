# Applied locally by the Supabase CLI. For the hosted project, mirror these
# in Dashboard > Authentication (rate limits, sessions, MFA, CAPTCHA).
project_id = "medbridge-admin"

[auth]
enable_signup = false
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.rate_limit]
sign_in_sign_ups = 10          # per 5 min per IP
token_refresh = 150

# Server-enforced session limits (requires Pro plan on hosted Supabase)
[auth.sessions]
timebox = "8h"
inactivity_timeout = "1h"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Enable and add the secret in Dashboard to turn on CAPTCHA for sign-in
[auth.captcha]
enabled = false
provider = "turnstile"
secret = "env(TURNSTILE_SECRET)"

[functions.send-test-email]
verify_jwt = true

# Public endpoint called by the job board; validates input itself and uses the service role.
[functions.submit-application]
verify_jwt = false

[functions.resend-application]
verify_jwt = true
